<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>browser product closure probe</title>
  <style>
    body { margin: 0; min-height: 2600px; font: 16px system-ui; }
    #overlay { position: fixed; inset: 0; opacity: 0; pointer-events: none; }
    #lazy { display: block; margin-top: 2200px; width: 320px; height: 180px; background: #ddd; }
  </style>
</head>
<body>
  <div id="overlay">boot</div>
  <img id="lazy" alt="lazy product asset" width="320" height="180">
  <script>
    console.log("startup-probe");
    const image = document.getElementById("lazy");
    const observer = new IntersectionObserver((entries) => {
      if (!entries.some((entry) => entry.isIntersecting) || image.src) return;
      image.src = "/tests/attempts/browserProductClosure/lazy.svg";
      observer.disconnect();
    });
    observer.observe(image);
  </script>
</body>
</html>
