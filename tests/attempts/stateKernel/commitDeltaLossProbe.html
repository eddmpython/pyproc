<!DOCTYPE html>
<!--
probe: 델타 유실 결정적 재현기.
증상(게이트 실측 3회, 간헐): 커밋 성공 + HEAD 정확 + 물질화된 힙에서 직전 변수 실종, 이어
blob is missing. 가설: pack/prune + pack-recover(다른 저널 인스턴스) 직후의 커밋에서
한 인스턴스의 주소 캐시가 다른 인스턴스의 pack 뒤에도 살아 있어 이미 지워진 blob 주소를
다시 단언한다. 첫 검사는 stale 주소 수명주기를 결정적으로 만들고, 둘째 검사는 원래 관측 순서를
반복한다.
실행: node tests/browser/run.mjs tests/attempts/stateKernel/commitDeltaLossProbe.html
-->
<html lang="ko">
<head><meta charset="utf-8"><title>probe: commit delta loss</title>
<style>body{font:14px/1.5 system-ui;margin:2rem;max-width:56rem} pre{background:#f4f4f5;padding:1rem;border-radius:6px;white-space:pre-wrap}</style></head>
<body>
<h1>probe: 간헐 델타 유실(커밋 성공 + 변수 실종) 재현</h1>
<pre id="out">실행 중...</pre>
<script type="module">
  import { boot } from "../../../index.js";
  const out = document.getElementById("out");
  const checks = []; const timings = {};
  const check = (name, pass, info = "") => { checks.push({ name, pass: !!pass, info: String(info) }); out.textContent += `\n${pass ? "PASS" : "FAIL"} ${name}${info ? " (" + info + ")" : ""}`; };
  const report = async () => {
    const ok = checks.length > 0 && checks.every((c) => c.pass);
    try { await fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ok, checks, timings }) }); } catch (e) {}
  };
  try {
    const indexParam = new URLSearchParams(location.search).get("indexURL");
    const machine = await boot(indexParam ? { indexURL: new URL(indexParam, location.href).href } : {});
    const rt = machine.runtime;
    const reactive = rt.enableReactive();
    const root = await navigator.storage.getDirectory();
    try { await root.removeEntry("pyprocDeltaLossProbe", { recursive: true }); } catch (e) {}
    const dir = await root.getDirectoryHandle("pyprocDeltaLossProbe", { create: true });

    // 게이트의 선행 조건을 재현: 긴 체크포인트 역사 + 가지치기 흔적.
    for (let i = 0; i < 6; i++) { rt.run(`churn${i} = list(range(${1000 + i * 500}))`); reactive.checkpoint(); }
    const keepCp = reactive.checkpoint();
    rt.run("churnBranch = 'x' * 50000"); reactive.checkpoint();
    reactive.restoreLive(keepCp.index);
    reactive.pruneTo(keepCp.index);

    const gj = rt.enableJournal({ dir, reactive, includeHome: false });

    // 결정적 RED: writer만 X의 주소를 기억한다. collector가 X를 HEAD/PREV 밖으로 민 뒤 pack하면
    // X 전용 blob은 사라지지만 writer의 캐시는 남는다. X 체크포인트를 다시 커밋할 때 그 주소를
    // 검증 없이 재사용하면 성공한 HEAD가 없는 blob을 가리키고 recover는 PREV로 후퇴한다.
    const baseline = reactive.checkpoint();
    rt.run("stalePayload = 'x-state-' * 200000");
    const staleCp = reactive.checkpoint();
    const firstStale = await gj.commit();
    reactive.restoreLive(baseline.index);
    const collector = rt.enableJournal({ dir, reactive, includeHome: false });
    rt.run("replacementPayload = 'base-a'");
    await collector.commit();
    rt.run("replacementPayload = 'base-b'");
    await collector.commit();
    const packed = await collector.pack();
    reactive.restoreLive(staleCp.index);
    const staleCommit = await gj.commit();
    rt.run("stalePayload = 'clobbered'");
    const staleRecovered = await gj.recover();
    const staleValue = rt.run("globals().get('stalePayload', None)");
    const staleExact = !!staleRecovered && staleRecovered.fallback !== true
      && staleValue === "x-state-".repeat(200000);
    check("다른 controller의 pack 뒤 cached address가 없는 blob을 가리키지 않음", staleExact,
      JSON.stringify({ first: firstStale.commit.slice(7, 19), packed: packed.packed,
        stale: staleCommit.commit.slice(7, 19), fallback: staleRecovered && staleRecovered.fallback,
        valueLength: typeof staleValue === "string" ? staleValue.length : null }));

    // 아래 반복 검사는 결정적 수명주기와 별개인 원래 release 순서를 계속 보존한다.
    await gj.delete();
    reactive.restoreLive(keepCp.index);
    let failDetail = null;
    let iterations = 0;
    for (let round = 0; round < 10 && !failDetail; round++) {
      iterations = round + 1;
      // 게이트와 같은 순서: 두 커밋(주소 캐시 적재) -> pack -> prune -> 다른 인스턴스 recover.
      rt.run(`probeA = ${round} * 2 + 1`);
      await gj.commit();
      rt.run(`probeA = ${round} * 2 + 2`);
      const second = await gj.commit();
      await gj.pack();
      await gj.prune();
      rt.run("probeA = 999999");
      const other = rt.enableJournal({ dir, reactive, includeHome: false });
      const recovered = await other.recover();
      if (!recovered || rt.run("probeA") !== round * 2 + 2) { failDetail = { round, stage: "pack-recover", probeA: rt.run("probeA") }; break; }
      // 표적 구간: pack-recover 직후의 커밋이 새 변수를 담는가.
      rt.run(`probeFresh = 'round-${round}'`);
      const fresh = await gj.commit();
      const headRef = await gj._kernel.readRef("HEAD");
      rt.run("probeFresh = 'clobbered'");
      const back = await gj.recover();
      const survived = rt.run("'probeFresh' in globals()") === true && rt.run("probeFresh") === `round-${round}`;
      if (!back || !fresh || headRef.ref.commit !== fresh.commit || !survived) {
        // 법의학: 방금 커밋의 델타에 probeFresh 페이지가 들었는지 재계산으로 대조한다.
        const live = reactive.liveIdx;
        const nowHashes = rt.memory.pageHashes();
        const foldedLive = reactive.hashesAt(live);
        const boundary = reactive.hashesAt(0);
        let foldMismatch = 0;
        for (let i = 0; i < Math.min(nowHashes.length, foldedLive.length); i++) {
          if (nowHashes[i] !== foldedLive[i]) foldMismatch++;
        }
        failDetail = {
          round, stage: "fresh-commit",
          freshCommit: fresh && fresh.commit && fresh.commit.slice(7, 19),
          headAtRecover: headRef.ref && headRef.ref.commit.slice(7, 19),
          freshPages: fresh && fresh.pages,
          survived,
          probeFreshDefined: rt.run("'probeFresh' in globals()"),
          foldMismatchWords: foldMismatch,
          boundaryLen: boundary.length, liveLen: foldedLive.length, nowLen: nowHashes.length,
        };
      }
    }
    check(`델타 유실 없음(${iterations}회 반복: 커밋 -> pack -> prune -> 타 인스턴스 recover -> 커밋 -> recover)`,
      failDetail === null, failDetail ? JSON.stringify(failDetail) : `${iterations} rounds clean`);
    await root.removeEntry("pyprocDeltaLossProbe", { recursive: true });
  } catch (e) {
    check("예외 없음", false, String(e && (e.stack || e.message) || e).slice(0, 1200));
  } finally {
    await report();
  }
</script>
</body>
</html>
