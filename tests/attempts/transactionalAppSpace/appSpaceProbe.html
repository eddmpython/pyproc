<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Transactional AppSpace browser probe</title></head>
<body><output id="result">running</output>
<script type="module">
const checks = [];
const check = (name, pass, detail = null) => checks.push({ name, pass: !!pass, detail });
const iframe = document.createElement("iframe");
iframe.sandbox = "allow-scripts allow-forms";
iframe.setAttribute("credentialless", "");
iframe.src = "/tests/attempts/transactionalAppSpace/appTargetProbe.html";
document.body.append(iframe);
await new Promise((resolve, reject) => {
  const timer = setTimeout(() => reject(new Error("target ready timeout")), 5000);
  addEventListener("message", function ready(event) {
    if (event.source !== iframe.contentWindow || event.data?.protocol !== "pyproc-app-probe"
      || event.data?.type !== "ready") return;
    clearTimeout(timer); removeEventListener("message", ready); resolve();
  });
});
const channel = new MessageChannel();
const nonce = crypto.randomUUID();
const hello = await new Promise((resolve, reject) => {
  const timer = setTimeout(() => reject(new Error("app hello timeout")), 5000);
  channel.port1.onmessage = ({ data }) => {
    if (data?.type !== "hello" || data?.nonce !== nonce) return;
    clearTimeout(timer); resolve(data);
  };
  channel.port1.start();
  iframe.contentWindow.postMessage({ protocol: "pyproc-app-probe", version: 1, type: "hello", nonce }, "*", [channel.port2]);
});
let sequence = 0;
const pending = new Map();
channel.port1.onmessage = ({ data }) => {
  const wait = pending.get(data?.id);
  if (!wait) return;
  pending.delete(data.id);
  data.ok ? wait.resolve(data.value) : wait.reject(Object.assign(new Error(data.error.message), { code: data.error.code }));
};
const call = (operation, input = {}) => new Promise((resolve, reject) => {
  const id = `probe:${++sequence}`;
  pending.set(id, { resolve, reject });
  channel.port1.postMessage({ protocol: "pyproc-app-probe", version: 1, type: "request", id, operation, input });
});
check("credentialless opaque sandbox", hello.parentAccessible === false && hello.storageAccessible === false
  && hello.cookieAccessible === false, hello);
check("exact cooperative identity", hello.identity?.appId === "com.example.erp"
  && new URL(hello.url).origin === location.origin, hello.identity);
const described = await call("describe");
const fence1 = await call("quiesce", { expectedRevision: described.revision });
const first = await call("export", { expectedRevision: described.revision, fence: fence1.fence });
check("declared logical state only", first.state.form.amount === 42 && !JSON.stringify(first).includes("probe-private-value")
  && !JSON.stringify(first).includes("probe-cookie") && first.scope.includes("effectOutbox"), first.scope);
let fenced = false;
try { await call("mutate", { amount: 7 }); } catch (error) { fenced = error.code === "APP_QUIESCED"; }
check("quiesce fences mutation", fenced);
await call("resume");
await call("mutate", { amount: 77 });
const described2 = await call("describe");
const fence2 = await call("quiesce", { expectedRevision: described2.revision });
const raced = await call("export", { expectedRevision: described2.revision, fence: fence2.fence });
await call("forceRace");
const afterRace = await call("describe");
check("post-export revision check detects race", raced.revision !== afterRace.revision,
  { exported: raced.revision, current: afterRace.revision });
let staleRejected = false;
try { await call("export", { expectedRevision: raced.revision, fence: fence2.fence }); }
catch (error) { staleRejected = error.code === "APP_NOT_QUIESCED"; }
check("stale export is rejected", staleRejected);
await call("resume");
const beforeImport = await call("describe");
const importFence = await call("quiesce", { expectedRevision: beforeImport.revision });
let schemaRejected = false;
try { await call("import", { fence: importFence.fence, envelope: { ...first,
  identity: { ...first.identity, stateSchema: "forged/1" } } }); }
catch (error) { schemaRejected = error.code === "APP_IDENTITY_MISMATCH"; }
check("schema substitution is rejected", schemaRejected);
await call("import", { fence: importFence.fence, envelope: first });
await call("resume");
const staged = await call("stageEffect", { intentSha256: "a".repeat(64) });
const stagedFence = await call("quiesce", { expectedRevision: staged.revision });
const stagedState = await call("export", { expectedRevision: staged.revision, fence: stagedFence.fence });
check("effect remains staged in outbox", stagedState.outbox.length === 1
  && stagedState.outbox[0].state === "staged", stagedState.outbox);

const database = await new Promise((resolve, reject) => {
  const request = indexedDB.open("pyproc-app-pair-probe", 1);
  request.onupgradeneeded = () => { request.result.createObjectStore("candidates"); request.result.createObjectStore("markers"); };
  request.onerror = () => reject(request.error); request.onsuccess = () => resolve(request.result);
});
const transaction = database.transaction(["candidates", "markers"], "readwrite", { durability: "strict" });
transaction.objectStore("candidates").put({ appRevision: stagedState.revision, machineGeneration: "sha256:" + "b".repeat(64) }, "pair:partial");
await new Promise((resolve, reject) => { transaction.oncomplete = resolve; transaction.onerror = () => reject(transaction.error); });
const read = (store, key) => new Promise((resolve, reject) => {
  const tx = database.transaction(store, "readonly"); const request = tx.objectStore(store).get(key);
  request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error);
});
check("markerless candidate is inactive", !!await read("candidates", "pair:partial")
  && !await read("markers", "pair:partial"));
const commit = database.transaction(["candidates", "markers"], "readwrite", { durability: "strict" });
commit.objectStore("candidates").put({ appRevision: stagedState.revision, machineGeneration: "sha256:" + "b".repeat(64) }, "pair:active");
commit.objectStore("markers").put({ appRevision: stagedState.revision, machineGeneration: "sha256:" + "b".repeat(64) }, "pair:active");
await new Promise((resolve, reject) => { commit.oncomplete = resolve; commit.onerror = () => reject(commit.error); });
check("strict marker activates exact pair", (await read("markers", "pair:active")).appRevision === stagedState.revision);
database.close();
globalThis.appSpaceProbe = Object.freeze({ checks, hello, stagedState });
document.getElementById("result").textContent = checks.every((entry) => entry.pass) ? "green" : "red";
</script></body></html>
