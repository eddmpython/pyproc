<!doctype html>
<!--
The candidate, measured with the same assertions as headOfLineProbe's baseline.

The baseline recorded: guest B's request costs 1ms idle and 917ms while guest A loops - it waits out
A's entire loop. This probe asks whether hosting the guests in workers flips that, and it asks with
the same shape of assertion so the two numbers are comparable.

It also checks graduation item 1 directly: whether `WebMachineHost` needed any new branch. That is
verified by construction here - this page registers the worker adapter through the ordinary
`registerAdapter` and drives it through the ordinary `createMachine`/`boot`/`request`.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>workerGuest candidate - worker-hosted guests</title>
  <style>body{font:14px/1.5 system-ui;margin:2rem;max-width:62rem}pre{background:#f4f4f5;padding:1rem;border-radius:8px;white-space:pre-wrap}</style>
  <script>
    window.addEventListener("error", (event) => {
      fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ok: false, checks: [{ name: "module init", pass: false, info: event.message }] }) }).catch(() => {});
    });
    window.addEventListener("unhandledrejection", (event) => {
      fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ok: false, checks: [{ name: "unhandled rejection", pass: false, info: String(event.reason) }] }) }).catch(() => {});
    });
  </script>
</head>
<body>
<h1>workerGuest candidate: worker-hosted guests</h1>
<p>Same assertions as the baseline, with each guest's session hosted in its own worker.</p>
<pre id="out">running...</pre>
<script type="module">
  import { WebMachineHost, createPyprocGuestFactory } from "../../../src/machine/index.js";
  import { MemoryEthernetSwitch } from "../../../src/machine/devices/memoryEthernetSwitch.js";
  import { bootSession, openMachine } from "../../../src/session/session.js";
  import { createWorkerGuestFactory } from "./workerGuestAdapter.js";

  const out = document.getElementById("out");
  const checks = [];
  const timings = {};
  const check = (name, pass, info = "") => {
    checks.push({ name, pass: !!pass, info: String(info) });
    out.textContent += `\n${pass ? "PASS" : "FAIL"} ${name}${info ? ` (${info})` : ""}`;
  };
  const report = async () => {
    const ok = checks.length > 0 && checks.every((entry) => entry.pass);
    try {
      await fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ok, checks, timings }) });
    } catch (error) {}
  };

  const params = new URLSearchParams(location.search);
  const indexURL = params.get("indexURL") || undefined;
  const busyIterations = Number(params.get("iterations") || 8_000_000);
  const consoleLines = [];
  let sequence = 0;
  const ethernet = new MemoryEthernetSwitch();
  const host = new WebMachineHost({
    idFactory: () => `worker-guest-candidate-${++sequence}`,
    devices: {
      console: { kind: "console", write: (line) => consoleLines.push(String(line)) },
      net: ethernet,
    },
  });
  // Graduation item 1: registered and driven through the ordinary host surface, with no new branch.
  host.registerAdapter("worker-pyproc", createWorkerGuestFactory({
    workerURL: new URL("./guestWorker.js", import.meta.url).href,
    networkDeviceName: "net",
  }));
  // The shipped in-process adapter, registered as the control for the restore question below. The
  // campaign is about what a worker boundary changes, so any failure it finds has to be measured
  // against the same steps on the main thread before it can be called a worker problem.
  host.registerAdapter("inproc-pyproc", createPyprocGuestFactory({ bootSession, openMachine, packetDeviceName: "net" }));

  let alpha;
  let beta;
  let control;
  try {
    // FOUR REJECTED HYPOTHESES, kept because a rejected hypothesis is a measurement. Each one was a
    // candidate explanation for the packet-surface trap the controls below record, and each is dead:
    // below the machine layer a materialized image carries a plain global, a callable JS function,
    // `pyodide.ffi`, and a `to_py()` conversion without a scratch. So the trap is not "JS values do
    // not survive an image" - the session layer is healthy, and the cause lives above it.
    {
      const seed = await bootSession({ ...(indexURL ? { indexURL } : {}) });
      seed.rt.run("seedMarker = 11");
      // The surface's bootstrap imports `pyodide.ffi` before any image is taken, so that module's
      // state travels inside the image. Seeding it here keeps the reproduction faithful to that.
      seed.rt.run("from pyodide.ffi import to_js as _seedToJs");
      const seedImage = await seed.exportImage();
      const revived = await openMachine(seedImage, { trust: true });
      let setGlobalAfterRestore = "";
      try {
        revived.rt.setGlobal("probeValue", 7);
        setGlobalAfterRestore = String(revived.rt.run("probeValue"));
      } catch (error) {
        setGlobalAfterRestore = `THREW ${String(error?.message || error).slice(0, 120)}`;
      }
      check("MINIMAL: setGlobal survives a materialized image (no device involved)",
        setGlobalAfterRestore === "7",
        `probeValue -> ${setGlobalAfterRestore}, plain python -> ${revived.rt.run("seedMarker")}`);
      // A plain value crosses. A *callable* is the other half of the question: calling a JS function
      // from Python goes through a WebAssembly function-table entry, and that is the machinery the
      // failing surfaces above all depend on. Same session, one line apart, so nothing else differs.
      let callAfterRestore = "";
      try {
        revived.rt.setGlobal("probeFunction", () => 5);
        callAfterRestore = String(revived.rt.run("probeFunction()"));
      } catch (error) {
        callAfterRestore = `THREW ${String(error?.message || error).slice(0, 120)}`;
      }
      check("MINIMAL: a JS function set after a materialized image is callable from Python",
        callAfterRestore === "5",
        `probeFunction() -> ${callAfterRestore}`);
      let ffiAfterRestore = "";
      try {
        ffiAfterRestore = String(revived.rt.run("from pyodide.ffi import to_js\nstr(to_js({'a': 1}))"));
      } catch (error) {
        ffiAfterRestore = `THREW ${String(error?.message || error).slice(0, 120)}`;
      }
      check("MINIMAL: pyodide.ffi still works when the image was taken after importing it",
        !ffiAfterRestore.startsWith("THREW"),
        `to_js -> ${ffiAfterRestore}`);
      // The failing call is not "call a JS function", it is "call one and convert what it returned".
      // `pyprocNet.address()` ends in `.to_py()`, so this is the last untested piece of that path.
      let toPyAfterRestore = "";
      try {
        revived.rt.setGlobal("probeObjectFunction", () => ({ a: 1 }));
        toPyAfterRestore = String(revived.rt.run("probeObjectFunction().to_py()['a']"));
      } catch (error) {
        toPyAfterRestore = `THREW ${String(error?.message || error).slice(0, 120)}`;
      }
      check("MINIMAL: a JS object returned after a materialized image converts with to_py",
        toPyAfterRestore === "1",
        `to_py -> ${toPyAfterRestore}`);
    }

    // CONTROL, run first and on the main thread with the shipped adapter: does a guest that used its
    // packet device survive its own portable image? Whatever the worker candidate does at this step
    // has to be read against this reading, or a shared defect would be filed as a worker limitation.
    control = host.createMachine({
      machineId: "control",
      adapterId: "inproc-pyproc",
      manifest: { session: { ...(indexURL ? { indexURL } : {}) } },
      permissions: { devices: ["console", "net"] },
    });
    await control.boot();
    await control.request({ type: "run", code: "import pyprocNet\ncontrolAddress = pyprocNet.address()['endpointId']\ncontrolMarker = 99" });
    await control.pause();
    const controlImage = await control.snapshot();
    await control.restore(controlImage);
    await control.resume();
    let controlAfter = "";
    try {
      controlAfter = String(await control.request({ type: "run", code: "import pyprocNet\nstr(pyprocNet.address()['endpointId'])" }));
    } catch (error) {
      controlAfter = `THREW ${String(error?.message || error).slice(0, 120)}`;
    }
    check("CONTROL (main thread, shipped adapter): the packet surface is callable after a portable restore",
      controlAfter === "pyproc:control",
      `after restore -> ${controlAfter}`);

    // Narrowing the same control: this guest never touches the surface before its image is taken.
    // If it survives, the poison is what guest code did with the surface; if it dies too, the poison
    // is the surface's mere presence in the image, and the removal step is not doing what it claims.
    const untouched = host.createMachine({
      machineId: "untouched",
      adapterId: "inproc-pyproc",
      manifest: { session: { ...(indexURL ? { indexURL } : {}) } },
      permissions: { devices: ["console", "net"] },
    });
    await untouched.boot();
    await untouched.request({ type: "run", code: "untouchedMarker = 5" });
    await untouched.pause();
    await untouched.restore(await untouched.snapshot());
    await untouched.resume();
    let untouchedAfter = "";
    try {
      untouchedAfter = String(await untouched.request({ type: "run", code: "import pyprocNet\nstr(pyprocNet.address()['endpointId'])" }));
    } catch (error) {
      untouchedAfter = `THREW ${String(error?.message || error).slice(0, 120)}`;
    }
    check("CONTROL (never used the surface before the image): callable after a portable restore",
      untouchedAfter === "pyproc:untouched",
      `after restore -> ${untouchedAfter}`);
    try { await untouched.shutdown(); } catch (error) {}

    alpha = host.createMachine({
      machineId: "guestA",
      adapterId: "worker-pyproc",
      manifest: {
        session: { ...(indexURL ? { indexURL } : {}) },
        network: { macAddress: [0x02, 0, 0, 0, 0, 0x0a], ipv4Address: [10, 77, 0, 10] },
      },
      permissions: { devices: ["console", "net"] },
    });
    beta = host.createMachine({
      machineId: "guestB",
      adapterId: "worker-pyproc",
      manifest: {
        session: { ...(indexURL ? { indexURL } : {}) },
        network: { macAddress: [0x02, 0, 0, 0, 0, 0x0b], ipv4Address: [10, 77, 0, 11] },
      },
      permissions: { devices: ["console", "net"] },
    });
    const bootStart = performance.now();
    await Promise.all([alpha.boot(), beta.boot()]);
    timings.workerBootMs = Math.round(performance.now() - bootStart);
    check("two guests boot in their own workers through the ordinary host surface",
      (await alpha.inspect()).guest.hosted === "worker" && (await beta.inspect()).guest.hosted === "worker",
      `boot ${timings.workerBootMs}ms`);

    const idleStart = performance.now();
    await beta.request({ type: "run", code: "1 + 1" });
    timings.idleRequestMs = Math.round(performance.now() - idleStart);

    const busyCode = `total = 0\nfor i in range(${busyIterations}):\n    total += i\ntotal`;
    const busyStart = performance.now();
    const busy = alpha.request({ type: "run", code: busyCode });
    // "During the loop" has to be observable, not assumed: this flag is what turns a timing story
    // into an assertion. The baseline could never set it, because nothing else ran at all.
    let busySettled = false;
    busy.then(() => { busySettled = true; }, () => { busySettled = true; });

    const blockedStart = performance.now();
    const betaValue = await beta.request({ type: "run", code: "6 * 7" });
    timings.blockedRequestMs = Math.round(performance.now() - blockedStart);
    check("guest B returns the right value while A is busy", betaValue === 42, `value=${betaValue}`);

    // GRADUATION 3, the part the campaign was opened for. On one thread a frame sent while a guest
    // runs Python is seen 0 times during that turn, because the switch's pump cannot run. Here the
    // switch lives on the free host thread and guest B's kernel has a thread of its own, so a frame
    // goes out of Python, crosses the bridge, is answered by a peer on the switch, and comes back
    // into Python - all while guest A is still inside its loop.
    const ETHERTYPE = [0x88, 0xb5]; // IEEE local experimental: no ARP or ICMP auto-reply on this path
    const betaMac = [0x02, 0, 0, 0, 0, 0x0b];
    const peerMac = [0x02, 0, 0, 0, 0, 0xfe];
    const peerFrames = [];
    const peer = ethernet.connect({
      endpointId: "hostPeer",
      receive: (frame) => {
        peerFrames.push(frame.slice());
        peer.send(Uint8Array.from([...betaMac, ...peerMac, ...ETHERTYPE, ...new TextEncoder().encode("pong")]));
      },
    });
    const roundTripStart = performance.now();
    await beta.request({
      type: "run",
      code: [
        "import pyprocNet",
        "mac = list(pyprocNet.address()['mac'])",
        `pyprocNet.send(bytes([${peerMac.join(",")}] + mac + [${ETHERTYPE.join(",")}] + list(b'ping')))`,
      ].join("\n"),
    });
    let payload = null;
    for (let attempt = 0; attempt < 40 && payload === null && !busySettled; attempt += 1) {
      payload = await beta.request({
        type: "run",
        code: [
          "import pyprocNet",
          "frame = pyprocNet.recv()",
          "while frame is not None and frame[12:14] != bytes([" + ETHERTYPE.join(",") + "]):",
          "    frame = pyprocNet.recv()",
          "None if frame is None else frame[14:].decode()",
        ].join("\n"),
      }) ?? null;
    }
    timings.frameRoundTripMs = Math.round(performance.now() - roundTripStart);
    check("GRADUATION 3: a frame round-trips through Python while the other guest is inside its loop",
      payload === "pong" && !busySettled,
      `payload=${payload}, ${timings.frameRoundTripMs}ms, peer saw ${peerFrames.length} frame(s), A still looping=${!busySettled}`);

    const netStats = await beta.request({ type: "netInspect" });
    check("GRADUATION 3: the bridged device kept the port contract (send and receive both counted)",
      netStats && netStats.attached && netStats.sentFrames >= 1 && netStats.receivedFrames >= 1 && !netStats.lastError,
      `sent=${netStats?.sentFrames}, received=${netStats?.receivedFrames}, error=${netStats?.lastError}`);

    await busy;
    timings.busyLoopMs = Math.round(performance.now() - busyStart);

    // The assertion the baseline failed. "Bounded" is defined by the campaign README as staying near
    // the idle cost, not merely finishing before A does - so the bar is idle plus a message-hop
    // allowance, not half of A's loop.
    const hopAllowanceMs = 250;
    const bounded = timings.blockedRequestMs <= timings.idleRequestMs + hopAllowanceMs;
    check("GRADUATION 2: guest B is not blocked by guest A's loop",
      bounded,
      `idle ${timings.idleRequestMs}ms, blocked ${timings.blockedRequestMs}ms, loop ${timings.busyLoopMs}ms`);

    // The cost of worker hosting, stated rather than hidden (graduation item 5).
    timings.messageHopMs = timings.idleRequestMs;
    check("GRADUATION 5: the per-request message hop is recorded",
      Number.isFinite(timings.messageHopMs), `hop ~${timings.messageHopMs}ms`);

    // Guest A's own work still completed correctly - hosting did not silently drop it.
    const alphaResult = await busy;
    check("guest A's loop still produced its result", typeof alphaResult !== "undefined", `result=${alphaResult}`);

    check("host core needed no new branch (driven through registerAdapter/createMachine/request)",
      consoleLines.some((line) => line.startsWith("workerGuest:boot:")),
      consoleLines.slice(0, 2).join(" | "));

    // GRADUATION 4. The first candidate declared snapshotScope "none" because moving an image out of
    // a worker was unproven, and declaring a scope the host would then trust is the exact defect this
    // project keeps finding in itself. Now the claim is carried: the worker exports through the same
    // `exportImage` the in-process adapter uses, and `restore` terminates that worker and revives the
    // image in a *fresh* one. A fresh worker is a fresh process image, which is what the item asks.
    await beta.request({ type: "run", code: "portableMarker = 4242" });
    // EXPERIMENT (2026-07-31): does the consumer's own `import pyprocNet` binding decide whether the
    // image is portable? removePythonSurface() pops the module out of sys.modules and its own
    // globals, but a name the *guest code* bound is outside its reach, and the port's header already
    // names that as an honest limitation. This line is the control: with it the surviving reference
    // is gone, without it the revived kernel traps.
    await beta.request({ type: "run", code: "globals().pop('pyprocNet', None)\nNone" });
    // The ordinary lifecycle applies unchanged: a machine is paused before its image is taken. That
    // the worker-hosted guest needs no exception here is itself part of graduation item 1.
    await beta.pause();
    const snapshotStart = performance.now();
    const image = await beta.snapshot();
    timings.workerSnapshotMs = Math.round(performance.now() - snapshotStart);
    check("GRADUATION 4: the adapter declares and delivers a portable scope",
      image.snapshotScope === "portable" && image.payload.byteLength > 0,
      `${image.snapshotScope}, ${image.payload.byteLength} bytes`);
    const restoreStart = performance.now();
    await beta.restore(image);
    timings.workerRestoreMs = Math.round(performance.now() - restoreStart);
    await beta.resume();
    const revivedValue = await beta.request({ type: "run", code: "portableMarker + 1" });
    check("GRADUATION 4: a worker-hosted guest's image revives in a fresh worker",
      revivedValue === 4243,
      `marker ${revivedValue}, snapshot ${timings.workerSnapshotMs}ms, restore ${timings.workerRestoreMs}ms`);

    // The device has to come back with the guest, or "portable" would mean "portable minus its
    // hardware". The revived kernel re-attaches to the same switch through a new bridge, and the
    // Python surface that was stripped for the export is back.
    const revivedAddress = await beta.request({
      type: "run",
      code: "import pyprocNet\nstr(pyprocNet.address()['endpointId'])",
    });
    check("GRADUATION 4: the bridged device is re-attached after the crossing",
      revivedAddress === "guestB:net",
      `endpointId=${revivedAddress}`);
    peer.close();
  } catch (error) {
    check("no exception", false, String(error?.message || error).slice(-300));
  } finally {
    try { await alpha?.shutdown(); } catch (error) {}
    try { await beta?.shutdown(); } catch (error) {}
    try { await control?.shutdown(); } catch (error) {}
    await report();
  }
</script>
</body>
</html>
