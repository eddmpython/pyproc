<!doctype html>
<!--
Baseline for the workerGuest campaign: what one shared JS thread actually costs today.

This probe does not test a fix. It measures the problem, so that the graduation gate can be the
same assertion flipping from fail to pass. Two Python guests sit on one host and one switch, and
guest A runs a CPU-bound Python loop while we ask two questions about guest B:

  (1) How long does guest B's `request` take to come back while A is busy?
  (2) Can a frame A already sent reach B's Python *during* A's loop, or only after it ends?

Question 2 is the one that decides whether the frame contract can carry a protocol. A handshake
needs a reply inside one turn; if frames only land between `run()` calls, no handshake is possible.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>workerGuest baseline - head-of-line blocking</title>
  <style>body{font:14px/1.5 system-ui;margin:2rem;max-width:62rem}pre{background:#f4f4f5;padding:1rem;border-radius:8px;white-space:pre-wrap}</style>
  <script>
    window.addEventListener("error", (event) => {
      fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ok: false, checks: [{ name: "module init", pass: false, info: event.message }] }) }).catch(() => {});
    });
    window.addEventListener("unhandledrejection", (event) => {
      fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ok: false, checks: [{ name: "unhandled rejection", pass: false, info: String(event.reason) }] }) }).catch(() => {});
    });
  </script>
</head>
<body>
<h1>workerGuest baseline: head-of-line blocking</h1>
<p>Two Python guests on one host and one switch. Guest A runs a CPU-bound loop; we measure what
   guest B can still do. This is the baseline the graduation gate has to beat.</p>
<pre id="out">running...</pre>
<script type="module">
  import { bootSession, openMachine } from "../../../src/session/session.js";
  import { WebMachineHost, MemoryEthernetSwitch } from "../../../src/machine/index.js";
  import { createPyprocGuestFactory } from "../../../src/machine/index.js";

  const out = document.getElementById("out");
  const checks = [];
  const timings = {};
  const check = (name, pass, info = "") => {
    checks.push({ name, pass: !!pass, info: String(info) });
    out.textContent += `\n${pass ? "PASS" : "FAIL"} ${name}${info ? ` (${info})` : ""}`;
  };
  const report = async () => {
    const ok = checks.length > 0 && checks.every((entry) => entry.pass);
    try {
      await fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ok, checks, timings }) });
    } catch (error) {}
  };

  const params = new URLSearchParams(location.search);
  const indexURL = params.get("indexURL") || undefined;
  // The loop is sized to dominate a single turn without making the probe slow.
  const busyIterations = Number(params.get("iterations") || 8_000_000);
  const network = new MemoryEthernetSwitch({});
  let sequence = 0;
  const host = new WebMachineHost({
    idFactory: () => `worker-guest-baseline-${++sequence}`,
    devices: {
      console: { kind: "console", write: () => {} },
      network,
    },
  });
  host.registerAdapter("pyproc", createPyprocGuestFactory({ bootSession, openMachine, packetDeviceName: "network" }));

  let alpha;
  let beta;
  try {
    alpha = host.createMachine({
      machineId: "guestA",
      adapterId: "pyproc",
      manifest: { session: { ...(indexURL ? { indexURL } : {}) } },
      permissions: { devices: ["console", "network"] },
    });
    beta = host.createMachine({
      machineId: "guestB",
      adapterId: "pyproc",
      manifest: { session: { ...(indexURL ? { indexURL } : {}) } },
      permissions: { devices: ["console", "network"] },
    });
    await Promise.all([alpha.boot(), beta.boot()]);
    const alphaNet = (await alpha.inspect()).guest.network;
    const betaNet = (await beta.inspect()).guest.network;
    check("baseline: two guests share one host and one switch",
      !!alphaNet?.attached && !!betaNet?.attached, `${alphaNet?.endpointId} / ${betaNet?.endpointId}`);

    // Calibrate: how long does guest B's request take when nothing else is running?
    const idleStart = performance.now();
    await beta.request({ type: "run", code: "1 + 1" });
    timings.idleRequestMs = Math.round(performance.now() - idleStart);

    // Now: guest A runs a CPU-bound Python loop. We do NOT await it before asking B.
    const busyCode = `total = 0\nfor i in range(${busyIterations}):\n    total += i\ntotal`;
    const busyStart = performance.now();
    const busy = alpha.request({ type: "run", code: busyCode });

    // Question 1: guest B's request while A is busy.
    const blockedStart = performance.now();
    const betaValue = await beta.request({ type: "run", code: "6 * 7" });
    timings.blockedRequestMs = Math.round(performance.now() - blockedStart);
    check("guest B still returns the right value while A is busy", betaValue === 42, `value=${betaValue}`);

    await busy;
    timings.busyLoopMs = Math.round(performance.now() - busyStart);

    // The baseline finding, stated as an assertion that must flip at graduation:
    // on one shared thread, B's request cannot overtake A's loop, so it waits out most of it.
    const overlapped = timings.blockedRequestMs < timings.busyLoopMs / 2;
    check("BASELINE (expected to fail today): guest B is not blocked by guest A's loop",
      overlapped,
      `idle ${timings.idleRequestMs}ms, blocked ${timings.blockedRequestMs}ms, loop ${timings.busyLoopMs}ms`);

    // Question 2: can a frame land in B's Python during A's loop?
    await beta.request({ type: "run", code: "import pyprocNet\nwhile pyprocNet.recv() is not None:\n    pass\n0" });
    const busy2 = alpha.request({ type: "run", code:
      `import pyprocNet\n`
      + `frame = bytearray(60)\n`
      + `frame[0:6] = bytes(${JSON.stringify(betaNet.macAddress)})\n`
      + `frame[6:12] = bytes(${JSON.stringify(alphaNet.macAddress)})\n`
      + `frame[12:14] = (0x88b6).to_bytes(2, 'big')\n`
      + `pyprocNet.send(bytes(frame))\n`
      + busyCode });
    // Ask B whether the frame is visible while A is still inside the same turn.
    const duringLoop = await beta.request({ type: "run", code:
      `import pyprocNet\n`
      + `_seen = 0\n`
      + `while True:\n`
      + `    _f = pyprocNet.recv()\n`
      + `    if _f is None:\n`
      + `        break\n`
      + `    if _f[12:14] == (0x88b6).to_bytes(2, 'big'):\n`
      + `        _seen += 1\n`
      + `_seen\n` });
    await busy2;
    check("BASELINE (expected to fail today): a frame reaches guest B during A's turn",
      duringLoop >= 1, `frames seen mid-turn=${duringLoop}`);

    // And confirm the frame does arrive once the turn ends, so the wire itself is not broken.
    for (let turn = 0; turn < 8; turn += 1) await new Promise((resolve) => setTimeout(resolve, 25));
    const afterLoop = await beta.request({ type: "run", code:
      `import pyprocNet\n`
      + `_seen = 0\n`
      + `while True:\n`
      + `    _f = pyprocNet.recv()\n`
      + `    if _f is None:\n`
      + `        break\n`
      + `    if _f[12:14] == (0x88b6).to_bytes(2, 'big'):\n`
      + `        _seen += 1\n`
      + `_seen\n` });
    check("the wire works between turns (so the ceiling is the thread, not the frame path)",
      afterLoop >= 1, `frames seen after the turn=${afterLoop}`);
  } catch (error) {
    check("no exception", false, String(error?.message || error).slice(-300));
  } finally {
    try { await alpha?.shutdown(); } catch (error) {}
    try { await beta?.shutdown(); } catch (error) {}
    await report();
  }
</script>
</body>
</html>
