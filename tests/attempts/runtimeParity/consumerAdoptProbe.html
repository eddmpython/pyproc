<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>probe: consumerAdopt</title>
<style>body{font:14px/1.5 system-ui;margin:2rem;max-width:52rem} pre{background:#f4f4f5;padding:1rem;border-radius:6px;white-space:pre-wrap}</style></head>
<body>
<h1>probe: 로드된 엔진 채택 표면</h1>
<p>워커에서 자체 부팅한 Pyodide를 <code>new Runtime(py)</code>로 채택하고,
동기 실행의 무한 루프를 <code>setInterruptBuffer</code>로 취소하며,
<code>getGlobal</code> PyProxy를 call/toJs/destroy 경로에서 재사용하는 공개 표면을 검증한다.</p>
<pre id="out">실행 중...</pre>
<script type="module">
  import { boot, Runtime } from "../../../index.js";
  const out = document.getElementById("out");
  const checks = []; const timings = {};
  const check = (name, pass, info = "") => { checks.push({ name, pass: !!pass, info: String(info) }); out.textContent += `\n${pass ? "PASS" : "FAIL"} ${name}${info ? " (" + info + ")" : ""}`; };
  const report = async () => {
    const ok = checks.length > 0 && checks.every((c) => c.pass);
    try { await fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ok, checks, timings }) }); } catch (e) {}
  };
  try {
    // 자체 부팅한 Pyodide를 new Runtime(py)로 감싼다.
    const rt = await boot();
    // 워커 부팅 옵션: opts.loadPyodide를 주면 document 기반 script 로드를 건너뛴다(워커 소비자).
    // 여기선 첫 boot이 심은 전역 loadPyodide를 주입해 그 경로가 도는지 최소 검증한다.
    const rtViaLoad = await boot({ loadPyodide: (cfg) => globalThis.loadPyodide(cfg) });
    check("boot({loadPyodide}) 워커 부팅 옵션", rtViaLoad.run("2 ** 8") === 256);
    const py = rt.raw;
    const adopted = new Runtime(py);
    check("new Runtime(py) 채택 -> run/memory 동작", adopted.run("6 * 7") === 42 && adopted.memory.byteLength() > 0);
    // 채택한 Runtime의 능력 등록도 동작한다.
    const asgi = adopted.enableAsgiServer({ app: "_probeApp" });
    adopted.run("async def _probeApp(scope, receive, send):\n    await send({'type':'http.response.start','status':200,'headers':[(b'x',b'y')]})\n    await send({'type':'http.response.body','body':b'ok'})");
    await asgi.install();
    const resp = await asgi.serve("GET", "/");
    check("채택 Runtime의 enableAsgiServer 동작", resp.status === 200 && resp.body === "ok");

    // getGlobal이 PyProxy를 반환해 재사용 호출 + toJs + destroy를 지원한다.
    adopted.run("def _udf(a, b):\n    return {'sum': a + b, 'items': [a, b]}");
    const fn = adopted.getGlobal("_udf");
    const r = fn(3, 4);
    const asJs = r.toJs ? r.toJs() : r;
    const sum = asJs instanceof Map ? asJs.get("sum") : asJs.sum;
    check("getGlobal -> PyProxy call/toJs 재사용", typeof fn === "function" && typeof fn.destroy === "function" && sum === 7,
      `sum=${sum}`);
    if (r && r.destroy) r.destroy();
    fn.destroy();

    // setInterruptBuffer로 무한 실행을 취소한다. raw 없이 Runtime 표면에서 검증한다.
    const interruptSab = new SharedArrayBuffer(1);
    const view = new Uint8Array(interruptSab);
    const wired = adopted.setInterruptBuffer(interruptSab);
    check("Runtime.setInterruptBuffer 공개 표면", wired === true);
    let interrupted = false;
    view[0] = 2; // SIGINT: 다음 실행에서 KeyboardInterrupt
    try { adopted.run("while True:\n    pass"); } catch (e) { interrupted = String(e).includes("KeyboardInterrupt"); }
    view[0] = 0;
    check("인터럽트로 무한 루프 취소", interrupted);
  } catch (e) {
    check("예외 없음", false, String(e).slice(-300));
  }
  await report();
</script>
</body>
</html>
