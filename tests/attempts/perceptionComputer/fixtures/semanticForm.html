<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Semantic form</title>
<body><main><h1>Prepared order</h1><form id="order"><label>Account <input value="ACME-42"></label>
<label>Amount <input value="1250"></label><button>Submit order</button><p role="status">Ready</p></form>
<section id="noise" aria-label="Order history"></section></main>
<script>
  const noise = document.getElementById("noise");
  for (let index = 0; index < 120; index += 1) {
    const row = document.createElement("p"); row.textContent = `Archived order ${index + 1}`; noise.append(row);
  }
  document.getElementById("order").addEventListener("submit", (event) => {
    event.preventDefault(); document.querySelector('[role="status"]').textContent = "Accepted";
  });
</script></html>
