<!doctype html><html lang="en"><head><meta charset="utf-8"><title>owned kernel and x86 dual boot</title></head>
<body><pre id="out">running</pre><script type="module">
import { createWebComputer } from "../../../../src/machine/index.js";
import { V86 } from "../../fixtures/v86/assets/libv86.mjs";
import { V86_ADAPTER_VERSION, createV86ProbeManifest } from "../../fixtures/v86/config.js";
const output = document.getElementById("out");
const checks = [];
const timings = {};
const check = (name, pass, info = "") => {
  checks.push({ name, pass: pass === true, info: String(info) });
  output.textContent += `\n${pass ? "PASS" : "FAIL"} ${name}`;
};
const consoleLines = [];
const computer = createWebComputer({
  onConsole: (line) => consoleLines.push(String(line)),
  linux: { V86, adapterVersion: V86_ADAPTER_VERSION, manifest: createV86ProbeManifest() },
});
try {
  let startedAt = performance.now();
  await computer.bootAll();
  timings.dualBootMs = Math.round(performance.now() - startedAt);
  check("owned Python and x86 Linux boot together",
    computer.runningMachineIds().includes("pythonOs") && computer.runningMachineIds().includes("linuxOs"),
    timings.dualBootMs + "ms");
  const [pythonResult, linuxResult] = await Promise.all([
    computer.machine("pythonOs").request({ type: "run", code: "dualValue = 41\nprint(dualValue + 1)" }),
    computer.machine("linuxOs").request({ type: "serial", data: "echo DUAL_LINUX:42\n", waitFor: "# " }),
  ]);
  check("both guests execute", pythonResult.trim() === "42" && linuxResult.includes("DUAL_LINUX:42"));
  await computer.pauseRunning();
  const [pythonImage, linuxImage] = await Promise.all([
    computer.machine("pythonOs").snapshot(), computer.machine("linuxOs").snapshot(),
  ]);
  check("both snapshots are portable", pythonImage.snapshotScope === "portable"
    && linuxImage.snapshotScope === "portable" && pythonImage.adapterId !== linuxImage.adapterId);
  await computer.resumeAll();
  await computer.machine("pythonOs").request({ type: "run", code: "dualValue = 99" });
  await computer.pauseRunning();
  await computer.shutdownAll();
  check("both guests shut down", computer.machine("pythonOs").state === "stopped"
    && computer.machine("linuxOs").state === "stopped");
  startedAt = performance.now();
  await Promise.all([
    computer.machine("pythonOs").restore(pythonImage), computer.machine("linuxOs").restore(linuxImage),
  ]);
  timings.dualRestoreMs = Math.round(performance.now() - startedAt);
  check("both guests cold restore to paused", computer.machine("pythonOs").state === "paused"
    && computer.machine("linuxOs").state === "paused", timings.dualRestoreMs + "ms");
  await computer.resumeAll();
  const restored = await computer.machine("pythonOs").request({ type: "run", code: "print(dualValue)" });
  check("owned Python state survives dual restore", restored.trim() === "41");
  check("both adapters report exact identities", (await computer.machine("pythonOs").inspect()).adapterId === "cpython-wasi"
    && (await computer.machine("linuxOs").inspect()).adapterId === "x86-linux");
  check("both guests use the common console", consoleLines.some((line) => line.includes("kernel:boot"))
    && consoleLines.some((line) => line.startsWith("x86:")));
  await computer.shutdownAll();
} catch (error) {
  check("dual boot has no uncaught error", false, error?.stack || error?.message || error);
  await computer.shutdownAll().catch(() => undefined);
}
await fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ ok: checks.every((entry) => entry.pass), checks, timings }) });
</script></body></html>
