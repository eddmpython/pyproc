<!doctype html><html lang="en"><head><meta charset="utf-8"><title>owned kernel Machine Fleet probe</title></head>
<body><pre id="out">running</pre><script type="module">
import { MemoryMachineStore, createMachineFleet, createWebComputer } from "../../../../src/machine/index.js";
const output = document.getElementById("out");
const checks = [];
const check = (name, pass, info = "") => {
  checks.push({ name, pass: pass === true, info: String(info) });
  output.textContent += `\n${pass ? "PASS" : "FAIL"} ${name}`;
};
const store = new MemoryMachineStore();
let ownerSerial = 0;
const createComputer = ({ machineId, environmentFingerprint }) => createWebComputer({
  cryptoProvider: crypto,
  durability: {
    groupId: `ownedFleet/${machineId}`,
    store,
    lockManager: { request(_name, _options, callback) { return Promise.resolve().then(callback); } },
    ownerId: `fleet-owner-${++ownerSerial}`,
    environmentFingerprint,
  },
});
const fleet = createMachineFleet({ hotLimit: 1 });
try {
  const registered = fleet.register({ machineId: "alpha",
    environmentFingerprint: "cpython-wasi-3.14.6-fleet-v1", createComputer });
  check("fleet registers the owned kernel computer", registered === "alpha");
  const lease = await fleet.acquire("alpha", "prepare owned state");
  check("fleet acquires one hot computer", fleet.inspect().hot === 1 && lease.machineId === "alpha");
  const prepared = await fleet.use(lease,
    (computer) => computer.machine("pythonOs").request({ type: "run", code: "fleetValue = 41\nprint(fleetValue)" }));
  check("fleet runs the owned Python guest", prepared.trim() === "41");
  fleet.release(lease, {});
  const suspended = await fleet.suspend("alpha", { lease });
  check("fleet suspends to a durable generation", suspended.terminal === "suspended" && fleet.inspect().hot === 0);
  const resumedLease = await fleet.resume("alpha", "restore owned state");
  const restored = await fleet.use(resumedLease,
    (computer) => computer.machine("pythonOs").request({ type: "run", code: "print(fleetValue + 1)" }));
  check("fleet restores the exact Python state", restored.trim() === "42");
  fleet.release(resumedLease, {});
  await fleet.dispose();
  check("fleet disposes all hot computers", fleet.inspect().hot === 0);
} catch (error) {
  check("fleet probe has no uncaught error", false, error?.stack || error?.message || error);
  await fleet.dispose().catch(() => undefined);
}
await fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ ok: checks.every((entry) => entry.pass), checks }) });
</script></body></html>
