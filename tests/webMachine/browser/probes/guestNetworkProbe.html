<!doctype html>
<!--
두 guest가 한 스위치에서 바이트를 교환하는지 본다. 이 probe가 생긴 이유는 감사 지적이다
(2026-07-27): 스위치와 프레임 계약과 권한 게이트는 있는데 붙일 port가 v86 쪽 하나뿐이어서,
"브라우저를 여러 guest OS가 올라가는 컴퓨터로 만든다"가 공존까지만 참이고 통신은 아니었다.
파이썬 guest 둘을 같은 스위치에 올려 그 경로를 증명한다. x86 자산이 필요 없으므로 CI에서 돈다
(Linux <-> 파이썬 교차는 packetNetworkProbe의 v86 레인이 본다).
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Web Machine guest network probe</title>
  <style>body{font:14px/1.5 system-ui;margin:2rem;max-width:62rem}pre{background:#f4f4f5;padding:1rem;border-radius:8px;white-space:pre-wrap}</style>
  <script>
    window.addEventListener("error", (event) => {
      fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ok: false, checks: [{ name: "module 초기화", pass: false, info: event.message }] }) }).catch(() => {});
    });
    window.addEventListener("unhandledrejection", (event) => {
      fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ok: false, checks: [{ name: "처리되지 않은 promise", pass: false, info: String(event.reason) }] }) }).catch(() => {});
    });
  </script>
</head>
<body>
<h1>Web Machine guest network probe</h1>
<p>파이썬 guest 둘을 하나의 bounded packet switch에 올리고, 프레임 왕복과 ARP/ICMP 자동 응답을 확인한다.</p>
<pre id="out">실행 중...</pre>
<script type="module">
  import { bootSession, openMachine } from "../../../../src/session/session.js";
  import { WebMachineHost, MemoryEthernetSwitch } from "../../../../src/machine/index.js";
  import { createPyprocGuestFactory } from "../../../../src/machine/index.js";

  const out = document.getElementById("out");
  const checks = [];
  const timings = {};
  const check = (name, pass, info = "") => {
    checks.push({ name, pass: !!pass, info: String(info) });
    out.textContent += `\n${pass ? "PASS" : "FAIL"} ${name}${info ? ` (${info})` : ""}`;
  };
  const report = async () => {
    const ok = checks.length > 0 && checks.every((entry) => entry.pass);
    try {
      await fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ok, checks, timings }) });
    } catch (error) {}
  };

  const params = new URLSearchParams(location.search);
  const indexURL = params.get("indexURL") || undefined;
  const consoleLines = [];
  let sequence = 0;
  const network = new MemoryEthernetSwitch({});
  const host = new WebMachineHost({
    idFactory: () => `guest-network-${++sequence}`,
    devices: {
      console: { kind: "console", write: (line) => consoleLines.push(String(line)) },
      network,
    },
  });
  host.registerAdapter("pyproc", createPyprocGuestFactory({ bootSession, openMachine, packetDeviceName: "network" }));

  // 파이썬이 프레임을 만든다. 자동 응답 티어가 아니라 파이썬 표면(pyprocNet)이 와이어를 쓰는지 본다.
  const buildArpRequest = (senderMac, senderIp, targetIp) => `
import pyprocNet
def _buildArp(senderMac, senderIp, targetIp):
    frame = bytearray(60)
    frame[0:6] = b'\\xff\\xff\\xff\\xff\\xff\\xff'
    frame[6:12] = bytes(senderMac)
    frame[12:14] = (0x0806).to_bytes(2, 'big')
    frame[14:16] = (1).to_bytes(2, 'big')
    frame[16:18] = (0x0800).to_bytes(2, 'big')
    frame[18] = 6
    frame[19] = 4
    frame[20:22] = (1).to_bytes(2, 'big')
    frame[22:28] = bytes(senderMac)
    frame[28:32] = bytes(senderIp)
    frame[32:38] = b'\\x00' * 6
    frame[38:42] = bytes(targetIp)
    return bytes(frame)
pyprocNet.send(_buildArp(${JSON.stringify(senderMac)}, ${JSON.stringify(senderIp)}, ${JSON.stringify(targetIp)}))
`;

  const settle = async () => { for (let turn = 0; turn < 8; turn += 1) await new Promise((resolve) => setTimeout(resolve, 25)); };

  let alpha;
  let beta;
  try {
    const bootStart = performance.now();
    alpha = host.createMachine({
      machineId: "pythonAlpha",
      adapterId: "pyproc",
      manifest: { session: { ...(indexURL ? { indexURL } : {}) } },
      permissions: { devices: ["console", "network"] },
    });
    beta = host.createMachine({
      machineId: "pythonBeta",
      adapterId: "pyproc",
      manifest: { session: { ...(indexURL ? { indexURL } : {}) } },
      permissions: { devices: ["console", "network"] },
    });
    await Promise.all([alpha.boot(), beta.boot()]);
    timings.dualGuestBootMs = Math.round(performance.now() - bootStart);

    const alphaNet = (await alpha.inspect()).guest.network;
    const betaNet = (await beta.inspect()).guest.network;
    check("두 guest가 각자 packet port를 갖는다", !!alphaNet && !!betaNet && alphaNet.attached && betaNet.attached,
      `${alphaNet?.endpointId} / ${betaNet?.endpointId}`);
    check("주소가 guest별로 갈린다(같은 스위치에서 서로를 구분한다)",
      alphaNet.ipv4Address.join(".") !== betaNet.ipv4Address.join(".")
      && alphaNet.macAddress.join(":") !== betaNet.macAddress.join(":"),
      `${alphaNet.ipv4Address.join(".")} vs ${betaNet.ipv4Address.join(".")}`);
    check("파이썬 표면이 guest 안에 있다",
      await alpha.request({ type: "run", code: "import pyprocNet\npyprocNet.address()['endpointId']" }) === alphaNet.endpointId);

    // 1) 원시 프레임 경로: alpha의 파이썬이 보낸 바이트가 beta의 파이썬 큐에 그대로 도착한다.
    const payload = "sentinel-frame-0123456789";
    const rawStart = performance.now();
    await alpha.request({ type: "run", code:
      `import pyprocNet\n`
      + `frame = bytearray(60)\n`
      + `frame[0:6] = bytes(${JSON.stringify(betaNet.macAddress)})\n`
      + `frame[6:12] = bytes(${JSON.stringify(alphaNet.macAddress)})\n`
      + `frame[12:14] = (0x88b5).to_bytes(2, 'big')\n`
      + `frame[14:14 + len(${JSON.stringify(payload)})] = ${JSON.stringify(payload)}.encode()\n`
      + `pyprocNet.send(bytes(frame))\n` });
    await settle();
    timings.guestFrameRoundTripMs = Math.round(performance.now() - rawStart);
    const received = await beta.request({ type: "run", code:
      `import pyprocNet\n`
      + `_frames = []\n`
      + `while True:\n`
      + `    _f = pyprocNet.recv()\n`
      + `    if _f is None:\n`
      + `        break\n`
      + `    _frames.append(_f)\n`
      + `next((f[14:14 + ${payload.length}].decode() for f in _frames if f[12:14] == (0x88b5).to_bytes(2, 'big')), '')\n` });
    check("guest A의 파이썬이 보낸 프레임이 guest B의 파이썬에 바이트 동일하게 도착",
      received === payload, `수신 "${received}"`);

    // 2) 자동 응답 티어: 상대 guest에 파이썬 코드가 없어도 주소가 살아 있다(ARP 응답).
    await alpha.request({ type: "run", code: buildArpRequest(alphaNet.macAddress, alphaNet.ipv4Address, betaNet.ipv4Address) });
    await settle();
    const betaAfterArp = (await beta.inspect()).guest.network;
    check("ARP 요청에 상대 guest가 자동 응답한다", betaAfterArp.arpReplies >= 1, `arpReplies=${betaAfterArp.arpReplies}`);
    const arpSeen = await alpha.request({ type: "run", code:
      `import pyprocNet\n`
      + `_seen = 0\n`
      + `while True:\n`
      + `    _f = pyprocNet.recv()\n`
      + `    if _f is None:\n`
      + `        break\n`
      + `    if _f[12:14] == (0x0806).to_bytes(2, 'big') and _f[20:22] == (2).to_bytes(2, 'big'):\n`
      + `        _seen += 1\n`
      + `_seen\n` });
    check("ARP 응답이 요청자 guest의 파이썬까지 돌아온다", arpSeen >= 1, `reply=${arpSeen}`);

    // 3) 스위치가 bounded임을 확인: 통계가 양쪽에서 대칭으로 늘었다.
    const switchState = network.inspect();
    check("스위치가 두 endpoint를 붙들고 프레임을 셌다",
      switchState.endpoints >= 2 && switchState.deliveredFrames >= 2,
      JSON.stringify({ endpoints: switchState.endpoints, delivered: switchState.deliveredFrames }));

    // 4) 회수: shutdown이 port를 떼고 스위치에서 빠진다(핸들을 잃으면 endpoint가 남는다).
    await beta.shutdown();
    const afterShutdown = network.inspect();
    check("guest shutdown이 스위치 endpoint를 회수한다",
      afterShutdown.endpoints === switchState.endpoints - 1,
      `${switchState.endpoints} -> ${afterShutdown.endpoints}`);
    const alphaSendAfter = await alpha.request({ type: "run", code:
      `import pyprocNet\npyprocNet.send(bytes(60))\n` });
    check("떠난 endpoint로 보내도 남은 guest는 살아 있다", alphaSendAfter === 60, `보낸 바이트=${alphaSendAfter}`);
  } catch (error) {
    check("예외 없음", false, String(error?.message || error).slice(-400));
  } finally {
    try { await alpha?.shutdown(); } catch (error) {}
    await report();
  }
</script>
</body>
</html>
