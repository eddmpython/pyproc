import { boot, open } from "pyproc";
import * as history from "pyproc/history";
const checks = [];
const check = (name, pass, info = "") => checks.push({ name, pass: pass === true, info: String(info) });
let machine = null;
let revived = null;
try {
  check("history subpath resolves", typeof history.MemoryStateStore === "function" && typeof history.commitState === "function");
  machine = await boot({ deterministic: true });
  const inspection = await machine.inspect();
  check("owned kernel boots", inspection.kernel.runtimeKind === "cpython-wasi" && inspection.kernel.workerOwned === true);
  const execution = await machine.run("print(sum(range(10)))");
  check("Python executes", execution.output.trim() === "45");
  await machine.run.set("goldenValue", { answer: 41, text: "한글" });
  check("typed value round trip", (await machine.run.get("goldenValue")).text === "한글");
  const checkpoint = await machine.history.checkpoint();
  await machine.run.set("goldenValue", { answer: 99 });
  await machine.history.restore(checkpoint);
  check("checkpoint rewinds", (await machine.run.get("goldenValue")).answer === 41);
  const cloned = await machine.proc.clone();
  const childResult = await cloned.process.execute("print(goldenValue['answer'] + 1)");
  check("process clone executes", childResult.output.trim() === "42" && (await cloned.process.wait()).exitCode === 0);
  await cloned.process.close();
  const image = await machine.history.export();
  check("Machine image is integrity sealed", image.protocol === "pyproc.kernel-machine-image" && typeof image.digest === "string");
  revived = await open(image);
  check("Machine image revives state", (await revived.run.get("goldenValue")).answer === 41);
  let corrupt = null;
  try { await open({ ...image, digest: "sha256:corrupt" }); } catch (error) { corrupt = error; }
  check("corrupt image fails closed", corrupt?.code === "PYPROC_MACHINE_INTEGRITY");
} catch (error) {
  check("uncaught golden workflow error", false, error?.stack || error?.message || error);
} finally {
  if (revived) await revived.close();
  if (machine) await machine.close();
  await fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ok: checks.every((entry) => entry.pass), checks }) });
}
