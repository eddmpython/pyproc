<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>owned kernel preflight without COI</title></head>
<body><pre id="out">실행 중...</pre><script type="module">
import { boot, checkEnvironment } from "../../index.js";
import { requireCoi } from "../../src/runtime/preflight.js";
const out = document.getElementById("out");
const checks = [];
const check = (name, pass, info = "") => { checks.push({ name, pass: pass === true, info: String(info) }); out.textContent += `\n${pass ? "PASS" : "FAIL"} ${name}`; };
check("헤더 없는 페이지", crossOriginIsolated === false);
const environment = checkEnvironment();
const issue = environment.issues.find((entry) => entry.code === "no-cross-origin-isolation");
check("환경 진단이 COI 부재를 보고", environment.ok === false && !!issue);
check("진단이 필요한 두 헤더를 안내", issue?.fix.includes("Cross-Origin-Opener-Policy") && issue.fix.includes("Cross-Origin-Embedder-Policy"));
check("진단이 Setup 앵커로 연결", issue?.fix.includes("#setup"));
let guardError = null;
try { requireCoi("owned kernel"); } catch (error) { guardError = error; }
check("COI guard가 typed error를 반환", guardError?.code === "PYPROC_ENV_UNSUPPORTED");
let bootError = null;
try { await boot(); } catch (error) { bootError = error; }
check("owned kernel boot가 암호 오류 없이 실패", bootError?.code === "PYPROC_ENV_UNSUPPORTED"
  && bootError.message.includes("Cross-Origin-Embedder-Policy"));
await fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ ok: checks.every((entry) => entry.pass), checks }) });
</script></body></html>
