<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pyproc machine</title>
  <style>body{font:14px/1.5 system-ui;margin:2rem}pre{white-space:pre-wrap}</style>
</head>
<body>
  <pre id="out">booting</pre>
  <script id="pyprocControlBootstrap" type="module">
    import { boot } from "../../index.js";
    import { FrameSpacePage } from "../automationSpace/frameSpacePage.js";
    import { installFailClosedNetworkPolicy } from "./mcpMachinePolicy.js";

    document.getElementById("pyprocControlBootstrap")?.remove();
    const out = document.getElementById("out");
    const log = (message) => { out.textContent += "\n" + message; };
    const trustedFetch = globalThis.fetch.bind(globalThis);
    const RUN_HARNESS = [
      "import io as _mcpIo, contextlib as _mcpCtx, json as _mcpJson",
      "_mcpBuf = _mcpIo.StringIO()",
      "_mcpVal = None",
      "with _mcpCtx.redirect_stdout(_mcpBuf), _mcpCtx.redirect_stderr(_mcpBuf):",
      "    try:",
      "        _mcpVal = eval(compile(_mcpSrc, '<mcp>', 'eval'), globals())",
      "    except SyntaxError:",
      "        exec(_mcpSrc, globals())",
      "print(_mcpJson.dumps({'stdout': _mcpBuf.getvalue(), 'value': None if _mcpVal is None else repr(_mcpVal)}, ensure_ascii=False))",
    ].join("\n");
    const params = new URLSearchParams(location.search);
    const controlToken = "__PYPROC_CONTROL_TOKEN__";
    if (!controlToken) throw new Error("pyproc machine requires a control token");
    params.delete("controlBootstrap");
    history.replaceState(null, "", `${location.pathname}?${params}`);
    const controlFetch = (url, options = {}) => trustedFetch(url, {
      ...options,
      headers: { ...(options.headers || {}), "X-PyProc-Control-Token": controlToken },
    });
    const automationProvider = params.get("automationProvider") || "";
    let frameConfig = null;
    if (automationProvider === "frame") {
      const encoded = params.get("frameConfig") || "";
      const base64 = encoded.replaceAll("-", "+").replaceAll("_", "/");
      const binary = atob(base64.padEnd(Math.ceil(base64.length / 4) * 4, "="));
      frameConfig = JSON.parse(new TextDecoder().decode(Uint8Array.from(binary, (char) => char.charCodeAt(0))));
    }
    const machine = await boot({ deterministic: true });
    const installPolicy = () => installFailClosedNetworkPolicy(machine, {
      frameOrigins: frameConfig?.targetOrigins || [],
    });
    installPolicy();
    const saved = [];
    const baseCheckpoint = await machine.history.checkpoint();
    log("machine ready");

    const operations = {
      async "machine.run"({ code }) {
        await machine.run.set("_mcpSrc", String(code ?? ""));
        const result = await machine.run.python(RUN_HARNESS);
        const line = result.output.split("\n").filter(Boolean).at(-1);
        if (!line) return { stdout: "", value: null };
        return JSON.parse(line);
      },
      async "machine.image.export"() {
        const image = await machine.history.export();
        const bytes = new TextEncoder().encode(JSON.stringify(image));
        const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
        const sha256 = [...digest].map((byte) => byte.toString(16).padStart(2, "0")).join("");
        let binary = "";
        const chunkBytes = 32768;
        for (let offset = 0; offset < bytes.byteLength; offset += chunkBytes) {
          binary += String.fromCharCode(...bytes.subarray(offset, offset + chunkBytes));
        }
        return { kind: "machineImage", mimeType: "application/x-pymachine",
          artifactRef: `artifact:machine_${sha256}`, byteLength: bytes.byteLength,
          sha256, generation: image.digest, dataBase64: btoa(binary) };
      },
      async "machine.checkpoint.save"() {
        const checkpoint = await machine.history.checkpoint();
        saved.push(checkpoint);
        return { index: saved.length - 1, checkpointRef: checkpoint.checkpointRef,
          deltaDepth: checkpoint.deltaDepth,
          memoryBytes: checkpoint.memoryLayout.currentPages * 65536 };
      },
      async "machine.checkpoint.restore"({ checkpointRef, index } = {}) {
        const target = Number.isInteger(index) ? saved[index]
          : checkpointRef === undefined || checkpointRef === null
            ? saved[saved.length - 1]
            : saved.find((checkpoint) => checkpoint.checkpointRef === checkpointRef);
        if (!target) throw new Error(`checkpointRestore: no saved checkpoint (${checkpointRef ?? index ?? "latest"})`);
        const info = await machine.history.restore(target);
        return { index: saved.indexOf(target), checkpointRef: target.checkpointRef,
          restored: info.state === "completed" };
      },
      async "machine.reset"() {
        const info = await machine.history.restore(baseCheckpoint);
        saved.length = 0;
        installPolicy();
        return { checkpointRef: baseCheckpoint.checkpointRef, restored: info.state === "completed" };
      },
    };
    const frameSpace = frameConfig ? new FrameSpacePage(frameConfig) : null;
    if (frameSpace) Object.assign(operations, frameSpace.operations());

    const pageEpoch = crypto.randomUUID();
    const ready = await controlFetch("/controlReady", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ protocol: "pyproc-control", version: 1, pageEpoch, spaceId: "machine:primary" }),
    });
    if (!ready.ok) throw new Error(`control ready failed: ${ready.status}`);
    for (;;) {
      let command;
      try {
        const response = await controlFetch(`/controlCommand?pageEpoch=${encodeURIComponent(pageEpoch)}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`control poll failed: ${response.status}`);
        command = await response.json();
      } catch (error) {
        break;
      }
      if (!command || command.none) continue;
      let body;
      try {
        if (command.pageEpoch !== pageEpoch) throw new Error("stale control page epoch");
        if (!operations[command.operation]) throw new Error(`unknown operation: ${command.operation}`);
        body = { requestId: command.requestId, pageEpoch, ok: true,
          value: await operations[command.operation](command.input || {}) };
        log(`${command.operation} done`);
      } catch (error) {
        body = {
          requestId: command.requestId,
          pageEpoch,
          ok: false,
          error: {
            code: error?.code || "PYPROC_INTERNAL",
            message: String(error?.message || error).slice(-400),
            outcome: error?.outcome || "applied",
            retryable: error?.retryable === true,
            details: {
              ...(error?.details && typeof error.details === "object" ? error.details : {}),
              ...(Number.isInteger(error?.failedActionIndex) ? { failedActionIndex: error.failedActionIndex } : {}),
              ...(error?.failedAction ? { failedAction: error.failedAction } : {}),
              ...(Array.isArray(error?.completed) ? { completed: error.completed } : {}),
            },
          },
        };
        log(`${command.operation} failed: ${body.error.code}`);
      }
      await controlFetch("/controlResult", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      }).catch(() => {});
    }
  </script>
</body>
</html>
