<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>pyproc first Python</title>
  <style>
    body { margin: 1.2rem; font: 15px/1.5 ui-monospace, Consolas, monospace; background: #101514; color: #f5f3ee; }
    button { background: #c94122; color: #fff; border: 0; border-radius: 8px; padding: .55rem 1rem; font: inherit; }
    pre { white-space: pre-wrap; }
    .dim { color: #aaa095; }
  </style>
</head>
<body>
  <p class="dim">Installed package first success</p>
  <h1>Run Python</h1>
  <p>Boot the owned CPython kernel and print the first receipt.</p>
  <button id="run" type="button">Run Python</button>
  <p id="status">Ready.</p>
  <pre id="output"></pre>
  <script type="module">
    import { boot } from "../../index.js";
    import { FIRST_SUCCESS_PYTHON } from "./firstSuccessContract.js";
    import { runFirstSuccess } from "./runFirstSuccess.js";

    const status = document.getElementById("status");
    const output = document.getElementById("output");
    const runButton = document.getElementById("run");

    async function run() {
      runButton.disabled = true;
      output.textContent = FIRST_SUCCESS_PYTHON;
      status.textContent = "Loading the verified CPython WASI package...";
      let pass = false;
      let info = "";
      try {
        const result = await runFirstSuccess(boot);
        output.textContent += `\n${result.output}`;
        if (result.packageOutput) output.textContent += `\n${result.packageOutput}`;
        pass = result.output === result.expectedOutput && Boolean(result.packageOutput);
        info = result.output;
      } catch (error) {
        info = `${error?.code || ""} ${error?.message || error}`.trim();
        output.textContent += `\n${info}`;
        status.textContent = "The first success path failed.";
      } finally {
        runButton.disabled = false;
      }
      if (new URLSearchParams(location.search).has("gate")) {
        await fetch("/gateReport", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ok: pass, checks: [{ name: "firstSuccess", pass, info }] }) });
      }
    }

    runButton.addEventListener("click", run);
    if (new URLSearchParams(location.search).has("gate")) run();
  </script>
</body>
</html>
